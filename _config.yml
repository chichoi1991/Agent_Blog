title: "Microsoft Copilot Agentic Blog"
description: "Microsoft Copilot 에이전트 생태계 — 실무 가이드, 핸즈온 워크샵, 기술 업데이트를 한곳에서"
baseurl: "/Agent_Blog"
url: ""
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-seo-tag

collections:
  chapters:
    output: true
    permalink: /:collection/:name/

defaults:
  - scope:
      path: ""
      type: "chapters"
    values:
      layout: "chapter"
  - scope:
      path: ""
    values:
      layout: "default"

# Sidebar navigation sections
nav_sections:
  - key: newcs
    title: "New Copilot Studio (CLI Agent)"
    icon: "⚡"
  - key: newcslab
    title: "핸즈온 워크샵 (New Copilot Studio)"
    icon: "🧪"
  - key: guide
    title: "Copilot Studio 실무 가이드 (Classic)"
    icon: "📘"
  - key: workshop
    title: "핸즈온 워크샵 (Classic)"
    icon: "🛠️"
  - key: special
    title: "특별 워크샵 (Classic)"
    icon: "⭐"
  - key: cowork
    title: "Cowork Collective"
    icon: "🤝"
  - key: updates
    title: "기술 업데이트"
    icon: "🔔"
  - key: catblog
    title: "CAT 블로그 업데이트"
    icon: "🐱"
  - key: academy-courses
    title: "Agent Academy · 코스"
    icon: "🎓"
  - key: academy-labs
    title: "Agent Academy · 랩"
    icon: "🎯"

# Exclude dev/handoff docs from the built site
exclude:
  - HANDOFF-new-copilot-studio.md
  - README.md
  - Gemfile
  - Gemfile.lock

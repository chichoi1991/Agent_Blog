name: Sync newcs Lab chapters (passthrough)

# blog-content 허브의 newcs-labs 류 프로젝트(완성형 Jekyll 챕터)가 갱신되면 호출되어,
# 분할 변환 없이 챕터·이미지·스킬 zip 을 그대로 복사하고 PR 을 연다.
# PR 머지 시 기존 "Deploy Jekyll site to Pages" 워크플로가 자동 배포한다.
#
# 트리거:
#   - repository_dispatch (event_type: blog-content-updated, pipeline: newcs-passthrough)
#       client_payload: { source_repo, source_ref, source_path, pipeline, target }
#   - workflow_dispatch  ← 수동 실행
#
# 필요한 secret:
#   - SOURCE_REPO        예: chichoi1991/blog-content (없으면 dispatch payload 사용)
#   - SOURCE_REPO_TOKEN  소스 private repo 를 checkout 할 수 있는 PAT(repo read)

on:
  repository_dispatch:
    types: [blog-content-updated]
  workflow_dispatch:
    inputs:
      source_repo:
        description: "소스 repo (owner/name)"
        required: false
      source_ref:
        description: "소스 ref (branch/tag/sha)"
        required: false
        default: main
      source_path:
        description: "소스 repo 내 프로젝트 폴더(예: projects/newcs-labs)"
        required: false
        default: projects/newcs-labs

permissions:
  contents: write
  pull-requests: write

jobs:
  passthrough:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Resolve source coordinates
        id: src
        run: |
          REPO="${{ github.event.inputs.source_repo || github.event.client_payload.source_repo || secrets.SOURCE_REPO }}"
          REF="${{ github.event.inputs.source_ref || github.event.client_payload.source_ref || 'main' }}"
          SUBPATH="${{ github.event.inputs.source_path || github.event.client_payload.source_path || 'projects/newcs-labs' }}"
          PIPELINE="${{ github.event.client_payload.pipeline || 'newcs-passthrough' }}"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$REF"  >> "$GITHUB_OUTPUT"
          echo "subpath=$SUBPATH" >> "$GITHUB_OUTPUT"
          echo "pipeline=$PIPELINE" >> "$GITHUB_OUTPUT"
          if [ -z "$REPO" ]; then echo "::error::source_repo 가 비어 있습니다 (SOURCE_REPO secret 또는 dispatch payload 필요)"; exit 1; fi
          # repository_dispatch 로 들어온 다른 파이프라인은 이 워크플로가 처리하지 않는다(조용히 종료).
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "$PIPELINE" != "newcs-passthrough" ]; then
            echo "pipeline=$PIPELINE 은(는) 이 워크플로 대상이 아님 — 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout source docs (private)
        if: steps.src.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: _src

      - name: Read blog-sync.json
        if: steps.src.outputs.skip != 'true'
        id: cfg
        run: |
          set -euo pipefail
          CFG="_src/${{ steps.src.outputs.subpath }}/blog-sync.json"
          if [ ! -f "$CFG" ]; then echo "::error::$CFG 없음"; exit 1; fi
          echo "chaptersDir=$(jq -r '.chaptersDir // "chapters"' "$CFG")" >> "$GITHUB_OUTPUT"
          echo "imagesDir=$(jq -r '.imagesDir // "images"' "$CFG")" >> "$GITHUB_OUTPUT"
          echo "imagesTarget=$(jq -r '.imagesTarget // "assets/image/newcslab1"' "$CFG")" >> "$GITHUB_OUTPUT"
          echo "skillsDir=$(jq -r '.skillsDir // "skills"' "$CFG")" >> "$GITHUB_OUTPUT"
          echo "skillsTarget=$(jq -r '.skillsTarget // "assets/newcs/labs/newcslab1/skills"' "$CFG")" >> "$GITHUB_OUTPUT"

      - name: Copy chapters (verbatim) → _chapters
        if: steps.src.outputs.skip != 'true'
        run: |
          set -euo pipefail
          SRC="_src/${{ steps.src.outputs.subpath }}"
          CHAP="$SRC/${{ steps.cfg.outputs.chaptersDir }}"
          if [ -d "$CHAP" ]; then
            mkdir -p _chapters
            find "$CHAP" -maxdepth 1 -type f -iname '*.md' -exec cp -f {} _chapters/ \;
            echo "복사된 챕터:"; ls -1 "$CHAP"
          else
            echo "::warning::챕터 폴더 없음: $CHAP"
          fi

      - name: Copy images → assets target
        if: steps.src.outputs.skip != 'true'
        run: |
          set -euo pipefail
          SRC="_src/${{ steps.src.outputs.subpath }}"
          IMG="$SRC/${{ steps.cfg.outputs.imagesDir }}"
          DEST="${{ steps.cfg.outputs.imagesTarget }}"
          if [ -d "$IMG" ]; then
            mkdir -p "$DEST"
            find "$IMG" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' \) -exec cp -f {} "$DEST"/ \;
            echo "이미지 복사 → $DEST"
          fi

      - name: Copy skill ZIPs → assets target (downloadable)
        if: steps.src.outputs.skip != 'true'
        run: |
          set -euo pipefail
          SRC="_src/${{ steps.src.outputs.subpath }}"
          SK="$SRC/${{ steps.cfg.outputs.skillsDir }}"
          DEST="${{ steps.cfg.outputs.skillsTarget }}"
          if [ -d "$SK" ]; then
            mkdir -p "$DEST"
            find "$SK" -maxdepth 1 -type f -iname '*.zip' -exec cp -f {} "$DEST"/ \;
            echo "스킬 zip 복사 → $DEST"
          fi

      - name: Copy extra assets (per blog-sync.json extraAssets)
        if: steps.src.outputs.skip != 'true'
        run: |
          set -euo pipefail
          SRC="_src/${{ steps.src.outputs.subpath }}"
          CFG="$SRC/blog-sync.json"
          COUNT=$(jq '(.extraAssets // []) | length' "$CFG")
          echo "extraAssets 개수: $COUNT"
          for i in $(seq 0 $((COUNT-1))); do
            D=$(jq -r ".extraAssets[$i].dir" "$CFG")
            T=$(jq -r ".extraAssets[$i].target" "$CFG")
            if [ -d "$SRC/$D" ]; then
              mkdir -p "$T"
              find "$SRC/$D" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' -o -iname '*.webp' \) -exec cp -f {} "$T"/ \;
              echo "extra assets: $D → $T"
            else
              echo "::warning::extraAssets 폴더 없음: $SRC/$D"
            fi
          done

      - name: Clean up source checkout
        if: steps.src.outputs.skip != 'true'
        run: rm -rf _src

      - name: Create Pull Request
        if: steps.src.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(newcs-labs): sync lab chapters from source (passthrough)"
          branch: auto/newcs-passthrough
          delete-branch: true
          title: "Sync New Copilot Studio Lab chapters (passthrough)"
          body: |
            소스(blog-content `projects/newcs-labs`)의 완성형 Lab 챕터를 **분할 변환 없이 그대로** 반영했습니다.

            **검수 포인트**
            - [ ] 챕터 front matter(order/parent/is_parent/category) 정상
            - [ ] 콜아웃·표·코드블록·figure 렌더링 정상
            - [ ] 이미지(assets/image/newcslab1) 누락 없음
            - [ ] 스킬 zip 다운로드 경로 확인

            머지하면 GitHub Pages 배포가 자동 실행됩니다.
          labels: automated, newcs-labs

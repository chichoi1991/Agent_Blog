name: CAT blog sync (detect + assign Copilot)

# The Custom Engine(microsoft/mcscatblog) 공개 블로그의 신규 글을 주기적으로 감지해
# 원문 Markdown·이미지를 스테이징(main 커밋)하고, 번역 작업을 GitHub Copilot coding
# agent(copilot-swe-agent)에게 이슈로 위임한다. Copilot 이 번역 PR 을 자동 생성한다.
# (A 방식 — 완전 자동화. 번역까지 Copilot 이 수행)
#
# 흐름:
#   cron → fetch.mjs(감지·이미지 다운로드) → main 커밋 → assign-copilot.mjs(이슈+할당)
#        → Copilot 번역 PR → 사람 검수 merge → Pages 배포
#
# 트리거:
#   - schedule: 매일 2회 - 00:20 UTC(오전 9:20 KST), 12:20 UTC(오후 9:20 KST)
#   - workflow_dispatch: 수동 실행(limit 지정 가능)
#
# 토큰(할당용):
#   - 기본 GITHUB_TOKEN 으로 Copilot 할당이 안 되면, PAT(repo + issues 쓰기)을
#     secret CATBLOG_AGENT_TOKEN 으로 추가하면 그걸 우선 사용한다.

on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 12 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번에 스테이징할 최신 신규 글 최대 건수(비우면 전부)"
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  detect-and-delegate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect & stage new CAT posts (with images)
        id: detect
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"; fi
          node tools/catblog-sync/fetch.mjs $LIMIT_ARG
          if git status --porcelain tools/catblog-sync/incoming assets/catblog | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit staged sources to main
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catblog-sync/incoming assets/catblog
          git commit -m "chore(catblog): stage new CAT posts for translation"
          git push

      - name: Delegate translation to Copilot
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATBLOG_AGENT_TOKEN || secrets.GITHUB_TOKEN }}
        run: node tools/catblog-sync/assign-copilot.mjs

name: CAT blog sync (detect new posts)

# The Custom Engine(microsoft/mcscatblog) 공개 블로그의 신규 글을 주기적으로 감지해
# 원문 Markdown 을 tools/catblog-sync/incoming/ 에 스테이징하고 PR 을 연다.
#
# 번역은 이 워크플로가 하지 않는다(B 방식) — PR 브랜치를 로컬로 받아
# VS Code 의 `catblog-sync` 스킬(GitHub Copilot)로 번역해 _chapters/catblog*.md 를
# 만들고 같은 브랜치에 push → PR 검수 → merge 시 Pages 자동 배포.
#
# (향후 A 방식 업그레이드: 아래 PR 생성 대신 번역 Issue 를 만들어 @copilot 에게 할당)
#
# 트리거:
#   - schedule: 매일 00:20 UTC (한국시간 오전 9:20) 폴링
#   - workflow_dispatch: 수동 실행(limit 지정 가능)

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번에 스테이징할 최신 신규 글 최대 건수(비우면 전부)"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Detect & stage new CAT posts
        id: detect
        run: |
          LIMIT_ARG=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then LIMIT_ARG="--limit ${{ github.event.inputs.limit }}"; fi
          node tools/catblog-sync/fetch.mjs $LIMIT_ARG | tee /tmp/catblog.log
          if git status --porcelain tools/catblog-sync/incoming | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request (staged EN sources)
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(catblog): stage new CAT blog posts for translation"
          branch: auto/catblog-incoming
          delete-branch: true
          title: "CAT 블로그 신규 글 번역 대기 (catblog-sync)"
          body: |
            The Custom Engine(microsoft/mcscatblog)에서 신규 글을 감지해 원문(EN)을
            `tools/catblog-sync/incoming/` 에 스테이징했습니다. **아직 번역 전입니다.**

            ### 번역·게시 방법 (B 방식)
            1. 이 브랜치(`auto/catblog-incoming`)를 로컬로 checkout
            2. VS Code 에서 Copilot 에 **"catblog-sync 로 신규 글 번역해줘"**
               → `_chapters/catblog*.md` 생성(원문 출처·원저자 명시) + `state.json` 갱신 + incoming 제거
            3. `bundle exec jekyll build` 로 검증 후 같은 브랜치에 push
            4. 이 PR 을 검수 후 **merge** → GitHub Pages 자동 배포

            > ⚠️ 원문 출처(`source_url`)와 원저자(`source_author`)는 **반드시** 유지하세요.

            대기 목록은 `tools/catblog-sync/incoming/_manifest.json` 참조.
          labels: automated, catblog-sync

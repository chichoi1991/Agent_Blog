name: i18n parity

# 한국어(_chapters) / 영어(_chapters_en) 챕터가 같은 파일명으로 짝을 이루는지 검사한다.
# 언어 토글이 "두 컬렉션에 같은 slug 가 있다"는 규약에 기대고 있어서, 짝이 깨지면
# 토글이 반대 언어 홈으로 폴백하고 사이드바 계층·정렬도 언어별로 어긋난다.
#
# 정책:
#   - PR: 그 PR 에서 **새로 추가된** 챕터에 짝이 없으면 실패시킨다.
#     (기존에 쌓인 미번역 항목 때문에 무관한 PR 이 막히지 않도록 범위를 좁힌다.)
#   - master push / 수동 실행: 전체 리포트만 남기고 실패시키지 않는다.

on:
  pull_request:
    paths:
      - "_chapters/**"
      - "_chapters_en/**"
  push:
    branches: ["master"]
    paths:
      - "_chapters/**"
      - "_chapters_en/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Full parity report
        run: node tools/i18n/check-parity.mjs

      - name: Enforce parity for chapters added in this PR
        if: github.event_name == 'pull_request'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # 이 PR 에서 새로 추가(A)된 챕터 파일만 추린다.
          ADDED=$(git diff --name-only --diff-filter=A "$BASE" "$HEAD" \
            -- '_chapters/*.md' '_chapters_en/*.md' \
            | xargs -r -n1 basename | sort -u | paste -sd, -)
          if [ -z "$ADDED" ]; then
            echo "이번 PR 에서 새로 추가된 챕터가 없습니다 — 검사 통과."
            exit 0
          fi
          echo "새로 추가된 챕터: $ADDED"
          node tools/i18n/check-parity.mjs --strict --added "$ADDED"

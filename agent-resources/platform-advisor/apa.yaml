################################################################################
# Microsoft Agent Platform Advisor — 한국어판 데이터
# 원본: https://microsoft.github.io/AgentPlatformAdvisor/ (apa.yaml)
# 영문 원본은 apa.en.yaml 로 보존됨. 구조/점수/URL은 원본과 동일.
################################################################################
meta:
  version: '1.1'
  platforms:
  - id: agent_builder
    label: Agent Builder
  - id: m365_copilot
    label: Microsoft 365 Copilot
  - id: copilot_studio
    label: Copilot Studio
  - id: foundry
    label: Microsoft Foundry
questions:
- id: q1
  label: 이 에이전트를 만드는 사람은 누구인가요?
  purpose: Sets persona weight for interpreting later answers
  prompt: 어떤 플랫폼은 로우코드 도구를 쓰는 메이커를 위해 설계되었고, 어떤 플랫폼은 전문 개발 역량을 요구합니다.
  options:
  - id: q1a
    label: 현업 사용자 또는 업무 전문가 — 코딩 경험 없음
    scores:
      agent_builder: 3
      copilot_studio: 1
      foundry: 0
  - id: q1b
    label: 로우코드 메이커 또는 IT 전문가 — 드래그 앤 드롭 도구와 설정 작업에 익숙함
    scores:
      agent_builder: 1
      copilot_studio: 3
      foundry: 0
  - id: q1c
    label: 전문 개발자 — 코드를 작성하고 소프트웨어를 구축함
    scores:
      agent_builder: 0
      copilot_studio: 2
      foundry: 3
  - id: q1d
    label: 데이터 사이언티스트 또는 AI/ML 엔지니어 — AI 모델과 데이터 인프라를 다룸
    scores:
      agent_builder: 0
      copilot_studio: 1
      foundry: 3
- id: q8
  label: 이 에이전트를 사용할 대상은 누구인가요?
  purpose: External-facing is a hard constraint that affects platform eligibility
  prompt: 소규모 내부 팀이 사용하나요, 사내 전반의 폭넓은 사용자가 쓰나요, 아니면 고객·파트너 같은 외부 사용자가 쓰나요?
  hard_rules:
  - condition: option in [q8b]
    effect: 'Set agent_builder = 0 and m365_copilot = 0. Agent Builder has no external publishing path. Microsoft 365 Copilot is tenant-scoped only.

      '
  options:
  - id: q8a
    label: 나 또는 소규모 내부 팀 — 한정된 그룹을 위한 빠른 에이전트
    scores:
      agent_builder: 3
      copilot_studio: 2
      foundry: 1
  - id: q8c
    label: 부서 또는 사내 전반 — 다수 임직원이 사용할 관리형 에이전트가 필요함
    scores:
      agent_builder: 1
      copilot_studio: 3
      foundry: 2
  - id: q8b
    label: 외부 사용자 — 고객, 파트너 또는 일반 대중
    scores:
      agent_builder: 0
      copilot_studio: 3
      foundry: 3
    hard_rule_trigger: true
  - id: q8d
    label: 아직 결정하지 않음
    scores:
      agent_builder: 2
      copilot_studio: 2
      foundry: 1
- id: q2
  label: 사용자는 이 에이전트를 어디에서 사용하나요?
  purpose: Deployment surface is often a hard constraint
  prompt: 실제 업무 흐름에서 사람들이 이 에이전트에 접근하고 사용할 위치를 생각해 보세요.
  options:
  - id: q2a
    label: Microsoft 365 Copilot 채팅 내부 — Microsoft365.com, Office.com 또는 Teams 데스크톱/웹
    scores:
      agent_builder: 3
      copilot_studio: 3
      foundry: 2
  - id: q2b
    label: 커스텀 앱 내부 — 팀이 직접 만든 웹사이트 또는 모바일 앱
    scores:
      agent_builder: 0
      copilot_studio: 3
      foundry: 3
  - id: q2c
    label: 백그라운드에서 자동 실행 — 사람의 대화가 아닌 이벤트로 트리거됨
    scores:
      agent_builder: 0
      copilot_studio: 3
      foundry: 3
  - id: q2d
    label: 여러 곳에서 사용 또는 아직 결정하지 않음
    scores:
      agent_builder: 1
      copilot_studio: 3
      foundry: 3
- id: q4
  label: 이 에이전트는 어떤 일을 해야 하나요?
  purpose: Single strongest discriminator between Copilot Studio and Foundry
  prompt: 이 에이전트가 처리할 업무 유형은 무엇인가요? 수행할 것으로 예상되는 가장 고난도 작업을 기준으로 선택하세요.
  hard_rules:
  - condition: option == q4d
    effect: 'Set foundry = 3. Cap agent_builder and m365_copilot at 0 regardless of other answers.

      '
  options:
  - id: q4a
    label: 한 번의 문답으로 응답 — Q&A, 정보 조회 또는 요약
    scores:
      agent_builder: 3
      copilot_studio: 3
      foundry: 1
  - id: q4b
    label: 여러 차례 대화를 주고받으며 맥락을 기억
    scores:
      agent_builder: 2
      copilot_studio: 3
      foundry: 2
  - id: q4e
    label: Copilot 내부에서 콘텐츠 생성·분석 — 문서, 차트, 이미지 또는 간단한 데이터 분석
    scores:
      agent_builder: 3
      copilot_studio: 2
      foundry: 2
  - id: q4c
    label: 다단계 작업 수행 — 프로세스를 따라가고, 여러 시스템을 조회하며, 양식 제출이나 레코드 갱신 같은 액션 실행
    scores:
      agent_builder: 0
      copilot_studio: 3
      foundry: 3
  - id: q4d
    label: 복잡한 워크플로 관리 — 여러 에이전트를 조율하거나 장기 실행 프로세스를 처리
    scores:
      agent_builder: 0
      copilot_studio: 2
      foundry: 3
    hard_rule_trigger: true
- id: q3
  label: 이 에이전트는 어떤 정보에 접근해야 하나요?
  purpose: Grounding requirements narrow the field fast
  prompt: 이 에이전트가 필요로 하는 정보는 현재 어디에 있나요? 지금 정보가 위치한 곳과 가장 가까운 항목을 선택하세요.
  options:
  - id: q3a
    label: Microsoft 365 콘텐츠 — SharePoint, OneDrive, Teams, Outlook 또는 조직 구성원 데이터
    scores:
      agent_builder: 3
      copilot_studio: 2
      foundry: 1
  - id: q3b
    label: Microsoft 365 Copilot 커넥터로 이미 연결 가능한 업무 시스템 — Jira, ServiceNow, GitHub, Azure DevOps 등
    scores:
      agent_builder: 2
      copilot_studio: 3
      foundry: 2
  - id: q3c
    label: Dataverse, 커스텀 커넥터 또는 팀이 에이전트에 직접 노출할 수 있는 업무 API
    scores:
      agent_builder: 0
      copilot_studio: 3
      foundry: 2
  - id: q3d
    label: 혼합 — Microsoft 365 콘텐츠와 커넥터 기반 업무 시스템을 함께 사용
    scores:
      agent_builder: 2
      copilot_studio: 3
      foundry: 2
  - id: q3e
    label: 공개 웹사이트 또는 업로드 파일 — 범위 지정 웹 소스, PDF, Office 파일 등 임베드된 콘텐츠
    scores:
      agent_builder: 3
      copilot_studio: 2
      foundry: 1
  - id: q3f
    label: 커스텀 RAG, Azure AI Search, 프라이빗 인덱스, Foundry IQ 지식 베이스 또는 엔지니어링이 운영하는 대규모 검색 시스템
    scores:
      agent_builder: 0
      copilot_studio: 1
      foundry: 3
scoring:
  hard_rule_evaluation: pre_sum
  hard_rules:
    q4d:
      zero:
      - agent_builder
      - m365_copilot
      label: 복잡한 에이전트 오케스트레이션 — Agent Builder와 M365 Copilot은 멀티 에이전트나 장기 실행 오케스트레이션에 적합하지 않습니다
    q4c:
      zero:
      - agent_builder
      label: 다단계 액션 워크플로 — Agent Builder는 양식 제출, 레코드 갱신, 시스템 간 액션 실행을 할 수 없습니다
    q8b:
      zero:
      - agent_builder
      - m365_copilot
      label: 외부 사용자 대상 — Agent Builder와 M365 Copilot은 외부에 게시할 수 없습니다
    q2b:
      zero:
      - agent_builder
      label: 커스텀 앱 배포 — Agent Builder는 Microsoft 365 내부에서만 실행됩니다
    q2c:
      zero:
      - agent_builder
      label: 백그라운드 실행 — Agent Builder에는 이벤트 기반 또는 자율 실행 기능이 없습니다
    q3c:
      zero:
      - agent_builder
      label: 업무 시스템 직접 연동 — Agent Builder는 Dataverse, 커스텀 커넥터, 업무 API에 직접 연결할 수 없습니다
    q3f:
      zero:
      - agent_builder
      label: 커스텀 검색 아키텍처 — Agent Builder는 커스텀 RAG, Azure AI Search, 프라이빗 인덱스, Foundry IQ, 엔지니어링 운영 검색 시스템을 직접 사용할 수 없습니다
  raw_score_max: 15
  persona_preferences:
  - when:
      q1: q1d
    prefer: copilot_studio
    over: agent_builder
    rationale: 데이터 사이언티스트와 AI/ML 엔지니어에게는 Agent Builder보다 Copilot Studio를 권장합니다. 큐레이션된 모델 선택, 에이전트 평가, Foundry IQ 연동, VS Code 확장을 통한 코드 우선 개발, 더 유연한 오케스트레이션을 지원하기 때문입니다. 이는 Agent Builder가 제공하지 않는 기능입니다.
  recommendation_thresholds:
  - min: 12
    max: 15
    label: 매우 적합
    description: 모든 측면에서 요구사항과 잘 부합하는 플랫폼입니다.
  - min: 8
    max: 11
    label: 적합
    description: 일부 트레이드오프는 있지만 대부분의 요구사항을 충족합니다.
  - min: 4
    max: 7
    label: 부분 적합
    description: 시나리오를 처리할 수 있지만 우회 방법이 필요할 수 있습니다.
  - min: 0
    max: 3
    label: 권장하지 않음
    description: 이 시나리오에서는 요구사항을 충족하기 어려운 플랫폼입니다.
  tie_handling:
    threshold_points: 2
    present_as: complementary_pair
    tiebreakers:
    - when:
        q1: q1c
      platforms:
      - agent_builder
      - copilot_studio
      prefer: copilot_studio
      rationale: 제작자가 전문 개발자이고 점수가 동일한 경우 Copilot Studio가 더 적합합니다. VS Code 확장을 통한 코드 우선 작성을 지원하는 반면 Agent Builder는 노코드 전용이기 때문입니다.
    - when:
        q1: q1d
      platforms:
      - copilot_studio
      - foundry
      prefer: copilot_studio
      rationale: 제작자가 데이터 사이언티스트 또는 AI/ML 엔지니어이고 점수가 동일한 경우 Copilot Studio를 권장합니다. 프로덕션 에이전트로 가는 더 빠른 경로를 제공하며, Foundry는 더 깊은 커스텀 오케스트레이션에 적합하기 때문입니다.
    valid_pairs:
    - platforms:
      - copilot_studio
      - foundry
      rationale: Copilot Studio에서 구축하고, Foundry에서 커스텀 코드로 확장하세요.
    - platforms:
      - m365_copilot
      - copilot_studio
      rationale: 최종 사용자에게는 Microsoft 365 Copilot을, 커스터마이징과 확장에는 Copilot Studio를 사용하세요.
    - platforms:
      - agent_builder
      - m365_copilot
      rationale: Microsoft 365 네이티브 에이전트에는 Agent Builder를, 더 폭넓은 확장성에는 Microsoft 365 Copilot을 사용하세요.
  cross_question_notes:
  - when:
      q2: q2c
      q4: q4a
    note: 백그라운드 이벤트 기반 에이전트를 선택했지만 단순 Q&A도 함께 선택하셨습니다. 백그라운드 에이전트는 사용자 질문에 답하기보다 이벤트를 자동 처리하는 것이 일반적입니다. 이 에이전트가 이벤트 기반인지 대화형인지 다시 검토해 보세요.
  - when:
      q8: q8b
      q2: q2a
    note: 외부 사용자를 선택했지만 에이전트를 Microsoft 365 앱 내부에 두려고 하셨습니다. 외부 사용자는 일반적으로 조직의 Teams, SharePoint, Outlook에 접근할 수 없습니다. 외부 사용자에게 도달하려면 커스텀 웹 배포가 필요할 수 있습니다.
  - when:
      q1: q1a
      q4: q4d
    note: 복잡한 멀티 에이전트 오케스트레이션은 일반적으로 전문 개발 역량을 요구합니다. 개발팀과 협업하거나, 현재 경험 수준에 맞는 더 단순한 작업 유형을 선택하는 것을 검토해 보세요.
  - when:
      q1: q1a
      q3: q3c
    note: Dataverse, 커스텀 커넥터, API 같은 업무 시스템 직접 연동은 보통 기술적 전문성이 필요합니다. IT팀 또는 개발팀이 에이전트의 데이터 접근 설정을 지원할 수 있는지 확인해 보세요.
  - when:
      q1: q1a
      q3: q3f
    note: Azure AI Search, 프라이빗 인덱스, Foundry IQ, 대규모 RAG 같은 커스텀 검색 아키텍처는 보통 엔지니어링 전문성이 필요합니다. 에이전트를 구축하기 전에 개발팀 또는 데이터 플랫폼팀과 협업을 검토해 보세요.
  winner_persona_notes:
  - winner: foundry
    persona: q1a
    note: 이 시나리오에는 Microsoft Foundry가 적합하지만, 전문 개발 역량과 Azure 전문성이 필요합니다. 에이전트를 구축하고 운영하기 위해 개발팀과의 협업을 검토해 보세요.
recommendations:
  agent_builder:
    headline: Agent Builder
    description: 코드 작성 없이 몇 분 만에 경량 에이전트를 만들 수 있습니다. Microsoft 365 콘텐츠, 범위 지정 웹, 업로드 파일, 관리자가 승인한 Copilot 커넥터를 근거로 동작합니다
    resources_url: "../m365-copilot/#agent-builder"
    scoring_summary: Microsoft 365 Copilot 내부에서 소규모 팀이 쓰는 노코드 선언형 에이전트에 가장 적합합니다.
    exploration_best_for: Microsoft 365 Copilot에서 노코드 에이전트 만들기
    exploration_summary: 코드를 전혀 작성하지 않고 에이전트를 만들고 싶을 때 Agent Builder를 선택하세요. Microsoft 365 콘텐츠, 범위 지정 웹 소스, 업로드 파일, Microsoft 365 Copilot 커넥터로 이미 연결된 업무 데이터를 활용합니다. 본인이나 소규모 팀을 위한 Q&A, 요약, 정보 조회, 가벼운 콘텐츠·데이터 분석 도우미가 필요한 현업 사용자에게 이상적입니다.
    summary: 코드 작성 없이 Microsoft 365 Copilot 내부에서 바로 경량 선언형 에이전트를 만들고 싶은 현업 사용자에게 알맞은 출발점입니다.
    best_for:
    - 본인 또는 소규모 내부 팀을 위해 만드는 노코드 제작자
    - Microsoft 365 콘텐츠, 범위 지정 웹, 업로드 파일, 관리자 승인 Copilot 커넥터를 근거로 하는 에이전트
    - Q&A, 요약, 정보 조회, 코칭 및 가벼운 문서·차트·이미지·데이터 분석 시나리오
    watch_out_for:
    - 조직 외부 사용자와 공유할 수 없음
    - 부서 전반 또는 전사 규모 에이전트는 일반적으로 Copilot Studio의 배포·거버넌스 제어가 필요함
    - 외부 업무 데이터는 Microsoft 365 Copilot 커넥터로 연결되어야 함. 직접 API, Dataverse, 커스텀 데이터베이스, 프라이빗 검색 인덱스, 커스텀 검색은 Copilot Studio 또는 Foundry가 필요함
    - 커스텀 액션 로직, 승인, 분기 워크플로, 외부 시스템 갱신에는 부적합
    - Agent Builder의 공유·통합·수명주기·거버넌스 한계를 넘어서면 에이전트를 Copilot Studio로 복사하세요
    - 평가·테스트 도구 없음 — 품질 검증은 수동으로 해야 함
    - 수명주기 관리 없음 — 버전 관리, 환경 분리, CI/CD 미지원
    - 관측성 최소 — 에이전트 동작과 사용 현황 가시성이 제한적
    templates:
    - label: 커리어 코치
      description: 맞춤형 경력 개발 계획, 역량 격차 분석, 실행 가능한 조언

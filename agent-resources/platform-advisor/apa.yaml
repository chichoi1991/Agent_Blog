      url: https://learn.microsoft.com/viva/engage/ai-technology-with-viva-engage/agents-community-network-deployment-config
  copilot_studio:
    headline: Copilot Studio
    description: 지식, 도구, 워크플로, 이벤트 트리거, 사람의 검토, 연결된 에이전트, 평가, 모니터링, 멀티 채널 배포를 결합한 거버넌스 기반 엔터프라이즈 에이전트를 구축합니다
    resources_url: "../copilot-studio/"
    scoring_summary: 액션, 워크플로, 커넥터, 평가, 모니터링, 광범위한 배포가 필요한 엔터프라이즈 에이전트를 위한 거버넌스 기반 로우코드 플랫폼입니다.
    exploration_best_for: 거버넌스 기반 엔터프라이즈 에이전트와 워크플로 구축
    exploration_summary: 단순 지식 조회를 넘어서는 에이전트가 필요할 때 Copilot Studio를 선택하세요. CRM, 데이터베이스, API, MCP 서버, 워크플로, Microsoft 365 컨텍스트, 다른 에이전트와 연결됩니다. 추론하고, 액션을 실행하고, 품질을 평가하고, 여러 채널에 배포하는 거버넌스 기반 에이전트를 만드는 메이커와 IT팀에게 적합합니다.
    summary: 거버넌스 기반 엔터프라이즈 에이전트를 위한 최적의 로우코드 플랫폼입니다. 외부 시스템 연결, 업무 프로세스 자동화, 생성형 오케스트레이션, 품질 평가, 동작 모니터링, 웹사이트·Teams·Microsoft 365 등으로의 배포를 지원합니다.
    best_for:
    - 로우코드 메이커 및 IT 전문가
    - 외부 API, CRM, ERP, Dataverse, 데이터베이스, MCP 서버, 커스텀 커넥터에 연결되는 에이전트
    - 액션, 분기, 사람의 검토, 승인을 포함한 이벤트·일정·사용자 트리거 워크플로
    - 에이전트 간 오케스트레이션 — 하위 에이전트, 연결된 Copilot Studio 에이전트, A2A 연동
    - API가 없는 레거시 웹·데스크톱 앱을 컴퓨터 사용 기능으로 자동화
    - 생성형 오케스트레이션, Microsoft IQ 컨텍스트, 새 경험의 사용자별 메모리(선택)를 활용한 멀티턴 대화 경험
    - 내부 및 외부 대상 배포
    - 내장 평가 테스트 세트, 활동 맵, 분석, 모니터링, 테넌트 전체 에이전트 인벤토리
    watch_out_for:
    - 복잡한 ML 파이프라인이나 커스텀 모델 학습은 Foundry가 필요함
    - 고도로 커스터마이즈되거나 대규모이거나 코드 우선인 멀티 에이전트 오케스트레이션은 Foundry가 더 적합함
    - 심층 추론 모델을 포함한 큐레이션된 GA·미리 보기·실험 모델을 지원함. 임의의 자체 모델 호스팅, 커스텀 모델 학습, 모델 라우팅, 완전한 런타임 제어가 필요하면 Foundry를 사용
    - 메모리는 새 경험 미리 보기에서 사용자별·에이전트별 저장소와 수명주기 제한과 함께 제공됨. 커스텀 메모리 아키텍처, 더 긴 보존 기간, 애플리케이션 제어 메모리가 필요하면 Foundry를 사용
    - 컴퓨터 사용 기능은 자격 증명, 감독, 접근 제어, 관측성, 비용 거버넌스를 신중히 관리해야 함
    - 생성형 답변, 에이전트 액션, 테넌트 그래프 그라운딩, 워크플로, 추론 모델, 음성, 컴퓨터 사용에 따라 Copilot 크레딧이 빠르게 증가할 수 있음
    persona_tips:
      q1c: "\U0001F6E0️ <strong>개발자 팁:</strong> <a href=\"https://learn.microsoft.com/microsoft-copilot-studio/authoring-overview\" target=\"_blank\" rel=\"noopener noreferrer\">VS Code용 Copilot Studio 확장</a>을 사용하면 YAML로 Copilot Studio 에이전트를 만들 수 있습니다"
  foundry:
    headline: Microsoft Foundry
    description: 코드, 모델, 도구, ID, 네트워킹, 관측성을 완전히 제어하며 프로덕션급 에이전트를 구축·배포·평가·운영하는 개발자 플랫폼이자 관리형 에이전트 런타임입니다
    resources_url: "../microsoft-foundry/"
    scoring_summary: 프로덕션 에이전트에 코드 우선 제어, 관리형 호스팅, 커스텀 검색, 고급 도구, ID, 관측성, 엄격한 규정 준수가 필요할 때 적합합니다.
    exploration_best_for: 프로덕션급 에이전트 시스템 구축 및 운영
    exploration_summary: 팀이 완전한 개발자 제어권을 갖춘 관리형 에이전트 런타임이 필요할 때 Microsoft Foundry를 선택하세요. 프롬프트 에이전트, 호스팅 코드 에이전트, 커스텀 프로토콜, Foundry 모델, 툴박스, MCP, Foundry IQ, 프라이빗 네트워킹, 에이전트 ID, 추적, 평가, 모니터링, Microsoft 365 및 커스텀 앱으로의 게시를 지원합니다. 전문 개발자, 아키텍트, ML 엔지니어를 위해 만들어졌습니다.
    summary: 프로덕션급 에이전트를 소프트웨어로 구축하고 운영해야 할 때 적합합니다. 관리형 엔드포인트, 버전 관리, 커스텀 코드, 모델 카탈로그 접근, 커스텀 검색, 에이전트 ID, 프라이빗 네트워킹, 추적, 평가, 모니터링을 제공합니다.
    best_for:
    - 전문 개발자, 아키텍트, ML 엔지니어
    - 애플리케이션 코드를 유지보수하지 않고 Foundry가 에이전트를 실행하게 하려면 프롬프트 에이전트를 사용
    - 자체 코드, Agent Framework, LangGraph, OpenAI Agents SDK, Anthropic Agent SDK, GitHub Copilot SDK, 커스텀 프레임워크가 필요하면 호스팅 에이전트를 사용
    - 자체 구축 애플리케이션, 백엔드 서비스, API, 웹훅, 음성 시스템, 커스텀 프로토콜에 임베드되는 에이전트
    - Foundry IQ, Azure AI Search, Azure Blob Storage, SharePoint, OneLake, 웹 소스, 인용, ACL, Purview 민감도 레이블을 활용한 커스텀 RAG 및 엔터프라이즈 검색
    - 중앙 집중식 인증, 버전 관리, 정책 적용을 갖춘 Foundry 툴박스 및 MCP 호환 도구 번들
    - 전용 Microsoft Entra 에이전트 ID, RBAC, 프라이빗 네트워킹, 콘텐츠 필터, 자체 Azure 리소스 사용
    - 전체 개발 수명주기 — 버전 관리, 안정적 엔드포인트, 롤백, 게시, 추적, 평가, 최적화, 모니터링, Application Insights 연동
    - Microsoft 365 Copilot, Teams, 커스텀 앱, 서비스, Entra 에이전트 레지스트리로 에이전트 게시
    - 엄격한 규정 준수, 데이터 상주, 프라이빗 네트워킹, 보안 요구사항
    watch_out_for:
    - 구현 복잡도가 높고 가치 실현까지 시간이 더 걸림
    - Azure 전문성과 개발 리소스가 필요함
    - 호스팅 에이전트는 컨테이너 컴퓨팅, 프레임워크, 프로토콜, 운영 책임이 추가됨
    - 일부 도구, 옵티마이저, A2A, 에이전틱 검색의 일부 기능은 API 버전·리전·구성에 따라 미리 보기 상태일 수 있음
    - 로우코드 부서 워크플로, Dataverse·커스텀 커넥터 자동화, 메이커 주도의 빠른 구현에는 Copilot Studio를 사용
    - 단순한 노코드 Microsoft 365 Copilot 지식 에이전트에는 Agent Builder를 사용
  cowork:
    headline: Copilot Cowork
    description: Microsoft 365 Copilot 내부에서 다단계 업무를 대신 계획하고 완료하는 완성형 에이전트입니다. 커스텀 스킬과 플러그인으로 확장할 수 있습니다
    resources_url: "../m365-copilot/#cowork"
    scoring_summary: 범위가 정해진 다단계 Microsoft 365 산출물을 필요할 때 위임하는 데 가장 적합합니다.
    exploration_best_for: 다단계 Microsoft 365 업무를 필요할 때 위임하기
    exploration_summary: Cowork는 Microsoft 365 Copilot 내부의 AI 대리인입니다. 원하는 결과를 설명하면 계획을 세우고 단계를 진행하며, 민감한 작업 전에는 승인을 위해 멈춥니다. 회의 준비, 받은 편지함·일정 정리, 심층 리서치, 연계된 문서 세트 작성에 이상적이며 사람이 확인하는 체크포인트를 제공합니다.
    summary: Microsoft 365 전반에 걸친 명확한 다단계 결과물을 위임하고 완성된 업무 패키지를 받으세요. 민감한 작업 전에는 승인과 체크포인트가 제공됩니다.
    best_for:
    - 범위가 정해진 다단계 Microsoft 365 산출물을 필요할 때 위임
    - 회의 자료 묶음, 받은 편지함·일정 정리, 심층 리서치, 연계된 문서 세트
    - 사람이 개입하는 제어 — 진행 상황 업데이트, 승인 체크포인트, 일시정지·재개·취소
    - Work IQ를 통해 Microsoft 365 컨텍스트(메일, 회의, 파일, 메시지)를 근거로 동작
    - 커스텀 스킬과 플러그인으로 경험 확장
    watch_out_for:
    - 필요할 때 사용자가 시작함 — 상시 실행이나 선제적 모니터링은 아님
    - Microsoft 365 중심 — 데스크톱, 셸, 브라우저, 로컬 파일 런타임은 없음
    - Copilot 크레딧 기반의 사용량 과금
    - 메일 발송이나 Teams 게시 같은 액션은 명시적 승인이 필요함
    - 직접 질문하고 반복하며 진행하고 싶다면 Microsoft 365 Copilot(Copilot 채팅)을 사용하세요
    - 업무가 지속적으로 실행되거나 Microsoft 365를 넘어서야 한다면 Scout를 사용하세요
  scout:
    headline: Microsoft Scout
    description: 파일, 셸, 브라우저, Microsoft 365 전반에서 자율적으로 동작하는 상시 실행 개인 Autopilot 데스크톱 앱입니다. 커스텀 스킬과 플러그인으로 확장할 수 있습니다
    resources_url: "../../scout/"
    scoring_summary: 데스크톱, 브라우저, Microsoft 365 전반에서 상시 선제적으로 후속 조치를 이어가는 데 가장 적합합니다.
    exploration_best_for: 상시 실행되는 개인 자율 에이전트
    exploration_summary: Scout는 Microsoft의 첫 번째 Autopilot입니다. 자체 ID를 가진 상시 실행 개인 에이전트로 파일, 셸, 브라우저, Microsoft 365 전반에서 자율적으로 동작하며, 일정이나 트리거에 따라 백그라운드에서도 실행됩니다. 로컬과 클라우드 환경을 아우르는 선제적 모니터링, 조율, 후속 조치에 이상적입니다. 현재 Frontier 미리 보기입니다.
    summary: 사용자가 지시하지 않아도 데스크톱, 브라우저, 로컬 파일, Microsoft 365 전반에서 업무를 선제적으로 이어가는 상시 실행 Autopilot입니다.
    best_for:
    - 일회성 작업이 아닌 지속적·선제적 후속 조치
    - 하트비트 모드와 오토메이션을 통한 일정 기반 또는 조건 트리거 작업
    - 로컬 파일, 셸 명령, 브라우저 자동화, 코드, Microsoft 365 전반에서 실행
    - 전문 하위 에이전트에게 업무 위임
    - 지연된 의사결정, 임박한 산출물 같은 리스크 모니터링
    - 커스텀 스킬과 플러그인으로 경험 확장
    watch_out_for:
    - Frontier 미리 보기 — 기능, 접근 권한, 상용화 세부사항이 변경될 수 있음
    - Frontier 등록, Intune 정책, 증명, GitHub Copilot 라이선스를 통해 접근이 제한됨
    - Windows 및 macOS용 데스크톱 애플리케이션
    - 민감한 작업(메일 발송, 파일 쓰기, 명령 실행)에는 승인이 필요함
    - 범위가 정해진 Microsoft 365 산출물을 필요할 때 처리하는 업무라면 Cowork를 사용하세요
    - 직접 질문하고 반복하며 진행하고 싶다면 Microsoft 365 Copilot(Copilot 채팅)을 사용하세요

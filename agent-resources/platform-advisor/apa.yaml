  m365_copilot:
    headline: Microsoft 365 Copilot
    description: Microsoft 365 Copilot 채팅, 검색, Word, Excel, PowerPoint, Outlook, Teams, Loop, Pages, Notebooks 및 Microsoft 제공 에이전트 전반에 내장된 권한 인식 AI
    resources_url: "../m365-copilot/"
    scoring_summary: Microsoft 365 Copilot의 기본 채팅, 검색, 앱 연동, 노트북, 자사 에이전트 기능만으로 이미 요구가 충족되는 시나리오에 적합합니다.
    exploration_best_for: Microsoft 365 전반의 내장 AI 활용하기
    exploration_summary: 임직원이 Microsoft 365 Copilot 채팅, Copilot 검색, Word, Excel, PowerPoint, Outlook, Teams, Loop, Pages, Notebooks 및 Researcher, Analyst, Facilitator, Interpreter 같은 Microsoft 제공 에이전트 전반에서 권한을 인식하는 내장 지원이 필요할 때 사용하세요. 커스텀 에이전트를 만들지 않고 기존 Microsoft 365 경험만으로 처리 가능한 업무에 이상적입니다.
    summary: Microsoft 365 Copilot의 내장 기능만으로 사용자 요구가 대부분 충족될 때 가장 좋습니다. 채팅, 검색, 앱 내 지원, 협업 페이지와 노트북, 그리고 각 사용자에게 허용된 업무 콘텐츠·연결 소스·웹을 근거로 동작하는 Microsoft 제공 에이전트를 포함합니다.
    start_here:
      chat:
        label: Copilot 채팅
        url: https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-overview
        tagline: 업무 흐름 속에서 질문하고, 요약하고, 초안을 작성
        description: Microsoft 365 Copilot의 대화형 관문입니다. 메일, 회의, 파일, 메시지를 근거로 직접 질문하고 반복하며 답변·요약·초안을 얻습니다. 전문 에이전트가 필요한 작업이면 여기서 바로 호출할 수 있습니다.
      agents:
        label: 내장 에이전트 — Researcher, Analyst, Facilitator, Interpreter
        url: https://learn.microsoft.com/microsoft-365/copilot/researcher-agent
        tagline: 전문 업무를 위해 설계된 목적형 에이전트
        description: 업무에 맞게 만들어진 에이전트로 시작하세요. 출처가 표기된 심층 리서치는 Researcher, Python 기반 데이터 분석은 Analyst, 회의록과 후속 조치는 Facilitator, 실시간 통역은 Interpreter입니다. 모두 Microsoft 365 Copilot 안에서 채팅과 함께 동작하므로 제품을 옮기지 않고 전환할 수 있습니다.
    best_for:
    - 사용자가 직접 시작하는 즉흥적 질문, 요약, 초안 작성
    - 업무를 위임하기보다 직접 진행하며 처리
    - Microsoft 제공 에이전트가 이미 처리하는 전문 업무
    - Microsoft 365 컨텍스트(메일, 회의, 파일, 메시지)를 근거로 동작
    watch_out_for:
    - 사용자가 계속 관여해야 함 — 다단계 작업을 처음부터 끝까지 스스로 수행하지 않음
    - 상시 실행이나 선제적 모니터링은 하지 않음
    - 범위가 정해진 다단계 산출물을 위임하고 싶다면 Cowork를 사용하세요
    - 업무가 지속적으로 진행되거나 시간에 걸쳐 실행되어야 한다면 Scout를 사용하세요
    first_party_label: 내장 Copilot 기능 및 에이전트
    first_party_agents:
    - label: Copilot 채팅
      description: Microsoft 365 콘텐츠와 웹 전반에서 초안 작성, 요약, 질의응답을 수행하는 권한 인식 채팅
      url: https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-overview
    - label: Copilot 검색
      description: Microsoft 365와 연결된 서드파티 소스를 아우르는 AI 통합 검색. 자연어 질의와 채팅 연계를 지원
      url: https://learn.microsoft.com/microsoft-365/copilot/microsoft-365-copilot-search
    - label: Copilot Pages 및 Notebooks
      description: 콘텐츠를 종합하고 큐레이션된 자료를 Copilot의 근거로 삼는 지속형 공유 작업 공간. SharePoint Embedded/Loop 컨테이너에 저장
      url: https://learn.microsoft.com/microsoft-365/loop/cpcn-requirements
    - label: Sales 에이전트
      description: Teams, Outlook, CRM 앱에서의 영업 생산성 지원
      url: https://learn.microsoft.com/microsoft-sales-copilot/
    - label: Service 에이전트
      description: 지원 채널 전반의 고객 서비스 상담 지원
      url: https://learn.microsoft.com/microsoft-copilot-service/
    - label: Finance 에이전트
      description: Excel과 Outlook에서의 재무 워크플로, 분석, 대사 처리
      url: https://learn.microsoft.com/copilot/finance/
    - label: 직원 셀프서비스 에이전트
      description: Teams 내에서 정책, FAQ, 요청을 처리하는 HR·IT 셀프서비스
      url: https://learn.microsoft.com/copilot/microsoft-365/employee-self-service/overview
    - label: SharePoint 에이전트
      description: 특정 SharePoint 사이트 또는 문서 라이브러리를 근거로 하는 Q&A
      url: https://support.microsoft.com/office/get-started-with-sharepoint-agents-69e2faf9-2c1e-4baa-8305-23e625021bcf
    - label: Facilitator 에이전트
      description: Teams에서 회의 진행, 실시간 공동 노트, Q&A, 타임라인 마커, 액션 아이템 및 Planner/Word 연동(미리 보기) 제공
      url: https://learn.microsoft.com/microsoftteams/facilitator-teams
    - label: Researcher 에이전트
